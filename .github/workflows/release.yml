name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  release:
    needs: [ci, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Require an exact release tag on current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Build cross-platform archives
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'
      - name: Verify packaged checksums and Linux entry point
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          version="${GITHUB_REF_NAME#v}"
          stage="${RUNNER_TEMP}/opaquedrop-release-smoke"
          mkdir -p "${stage}"
          tar -xzf "dist/opaquedrop_${version}_linux_amd64.tar.gz" -C "${stage}"
          test "$("${stage}/opaquedrop_${version}_linux_amd64/opaquedrop" version)" = "opaquedrop ${GITHUB_REF_NAME}"
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/opaquedrop_*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "OpaqueDrop ${GITHUB_REF_NAME}"
          --generate-notes
