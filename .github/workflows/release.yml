name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Test before packaging
        run: go test -count=1 ./...
      - name: Build cross-platform archives
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ github.ref_name }}'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "OpaqueDrop ${GITHUB_REF_NAME}"
          --generate-notes
